<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>endcredit overlay</title>
    <style>
      /* OBS 브라우저 소스는 배경이 투명해야 방송 화면 위에 얹힌다.
         여기서 배경색을 주면 방송 화면을 통째로 가린다. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
